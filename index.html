<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MingYang</title>
  <meta name="description" content="MingYang 的個人首頁，放一些自己會用的小工具" />
  <!--
    theme.js 要排在 style.css 前面，而且不能加 defer——
    data-theme 必須在第一次 paint 之前設好，晚一步就會閃一下深色。
    ?v= 是給瀏覽器快取用的版本號，改到這些檔案時記得一起加一。
  -->
  <!-- crossorigin 不能省：字體一律走 CORS 模式，漏掉會變成抓兩次 -->
  <link rel="preload" as="font" type="font/woff2" href="fonts/space-grotesk-latin.woff2" crossorigin />
  <script src="theme.js?v=1"></script>
  <link rel="stylesheet" href="style.css?v=8" />
</head>
<body>
  <header class="hero hero-home">
    <div class="container">
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="切換主題">🌙</button>
      <h1>MingYang</h1>
      <p class="tagline">做點自己會用的小東西，放在這裡</p>
    </div>
  </header>

  <main class="container">
    <section id="about">
      <h2>關於我</h2>
      <ul class="fact-list">
        <li><span class="fact-key">研究</span>TKU 人工智慧機器人碩士班</li>
        <li><span class="fact-key">工讀</span>味全龍 商品部</li>
      </ul>
    </section>

    <!--
      日後工具變多要拆「趣味 / 實驗室」的話，
      在 .tool-grid 前面插 <h3 class="tool-group">趣味</h3> 就分好了，
      每組各包一個 .tool-grid，CSS 已經備著。
    -->
    <section id="tools">
      <h2>小工具</h2>
      <div class="tool-grid">
        <a class="tool-card" href="tools/open-now/">
          <span class="tool-icon" aria-hidden="true">🍜</span>
          <span>
            <span class="tool-name">現在吃什麼</span>
            <span class="tool-desc">淡水現在還有哪些店開著</span>
          </span>
        </a>
        <a class="tool-card" href="tools/uiia-cat/">
          <span class="tool-icon" aria-hidden="true">🐈</span>
          <span>
            <span class="tool-name">uiia cat</span>
            <span class="tool-desc">點一下貓就轉，累積次數</span>
          </span>
        </a>
        <a class="tool-card" href="tools/cat-room/">
          <span class="tool-icon" aria-hidden="true">🐾</span>
          <span>
            <span class="tool-name">房間裡的貓</span>
            <span class="tool-desc">一隻自己過生活的貓，隨時可以來看牠</span>
          </span>
        </a>
      </div>
    </section>

    <section id="links">
      <h2>連結</h2>
      <ul class="link-list">
        <li><a href="https://github.com/Dipo221" target="_blank" rel="noopener">GitHub</a></li>
        <li><a href="mailto:kamisheep0221@gmail.com">Email</a></li>
      </ul>
    </section>
  </main>

  <footer class="container">
    <p>&copy; <span id="year"></span> MingYang</p>
  </footer>

  <script src="script.js?v=2"></script>
</body>
</html>
