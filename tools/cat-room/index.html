<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Disi — 房間裡的貓</title>
  <meta name="description" content="Disi 住在明陽淡水的房間裡。牠自己過生活，你可以進來看看牠在做什麼。" />
  <!--
    theme.js 要排在樣式表前面，而且不能加 defer——
    data-theme 必須在第一次 paint 之前設好，晚一步就會閃一下深色。
    這頁沒有切換鈕，跟著首頁選好的主題走。
    ?v= 是給瀏覽器快取用的版本號，改到這些檔案時記得一起加一。
  -->
  <link rel="preload" as="font" type="font/woff2" href="../../fonts/space-grotesk-latin.woff2" crossorigin />
  <!--
    木牌用的點陣字（Cubic 11，方形黑體）。400 KB。

    2026-09-08 以前這條 preload 只在手機生效（媒體查詢配 style.css 的
    @font-face 兩層一起擋桌機），因為桌機當時完全沒有介面條、一個字
    都不會顯示。現在桌機的角落牌子、選單抽屜、紙箱面板也都要用它，
    兩種寬度都真的會畫出這個字型，所以兩層擋桌機的媒體查詢一起拿掉——
    不預載的話桌機還是會抓，只是會晚一步，字先用 fallback 顯示再跳成
    Cubic 11（`font-display: swap`），跟本來就會 FOUT 的手機沒有兩樣。

    授權在 ../../fonts/cubic-11-OFL.txt，明文允許再散布（repo 是公開的，
    等於在再散布它）。理由與尺寸的規矩寫在 style.css 的「點陣字型」那一段。
  -->
  <link rel="preload" as="font" type="font/woff2" href="../../fonts/cubic-11.woff2" crossorigin />
  <script src="../../theme.js?v=1"></script>
  <link rel="stylesheet" href="../../style.css?v=10" />
  <link rel="stylesheet" href="style.css?v=29" />
</head>
<body>
  <!--
    main 刻意不是 .container：房間要滿版，所以它排在文字欄外面。
    用負 margin 把它從欄裡拉出來也可以，但那個算式要用 100vw，
    而 100vw 在有捲軸的桌機是含捲軸寬的，整頁會多出十幾 px 的橫向捲動。
  -->
  <main>
    <!--
      手機的介面條。滿版之後房間上面只剩這一條，下面什麼都沒有。

      **桌機不是整條藏起來，是分成兩半各自換位置。** 2026-09-08 以前
      桌機把木牌、天數、漢堡全部剝掉、只留一行字排到房間下面；那樣
      留下兩個問題：桌機的漢堡選單裝了內容也沒有入口打得開，而且
      .hud-sign 是全頁唯一的 <h1>，藏掉它等於桌機沒有可見標題。現在
      桌機把漢堡＋木牌＋天數合成一塊牌子，浮在房間左上角（.hud-row
      的桌機樣式，見 style.css）。#note 維持原樣，外觀剝光排到房間
      下面——它是全頁唯一 aria-live 的節點，複製成兩份會變成唸兩次，
      所以永遠只有一份 DOM，靠 CSS 換位置與長相。

      裡面的東西照 art/room.py 的木頭規則畫（頂面最亮、正面、側面），
      字是 Cubic 11 點陣字——手機和桌機的木牌現在都用（2026-09-08 起
      兩邊都載這個字型，理由見 style.css 的「點陣字型」那段）。
      #note 是例外，它剝光了，字體還原成站台的內文字體。詳細寫在
      style.css 的「手機的介面條」那一段。
    -->
    <div class="hud">
      <div class="hud-row">
        <!--
          待辦第 16 項：真的按鈕了，點開下面的 #menu-panel。
          圖示是純 CSS 畫的三條線（style.css 的 .hud-menu），沒有文字，
          所以要有 aria-label；面板長什麼樣、怎麼運作見 #menu-panel 那段。
        -->
        <button class="hud-menu" id="menu-btn" type="button"
                aria-expanded="false" aria-controls="menu-panel" aria-label="選單"></button>
        <h1 class="hud-sign">Disi</h1>
        <!-- 天數每天會變，由 script.js 填 -->
        <p class="hud-days" id="tagline"></p>
      </div>
      <!--
        22px 的中文一行只放得下大約 15 個字，超過會被切掉（CSS 沒有換行）。
        所以寫進這一格的句子有長度上限，見 script.js 的 setNote()。
      -->
      <p class="hud-note is-empty" id="note" role="status" aria-live="polite"></p>
    </div>

    <!--
      房間比視窗寬的時候（手機）靠這一層左右滑動來看，桌機則是整間剛好放得下。
      視角會自己跟著貓跑，見 script.js 的 follow()。
    -->
    <div class="room-bleed" id="room-bleed">
      <!--
        data-tod 由 script.js 依真實時間設定，跟站台的深／淺主題無關。
        房間是一扇看出去的窗，切主題不該把裡面的夜晚變成白天。
      -->
      <div class="room" id="room" data-tod="day">
        <!--
          牆、地板、屋頂、窗、碗都畫在 art/room-pano.png 裡了，不再是一堆 div。
          留在這裡的只有「會變的東西」：光束、碗裡的飼料、貓。
          疊圖順序改用 z-index 明寫（光束 1、貓 2、時段色片 3、四層發光層 4、天空 5），
          因為時段那層要蓋在貓上面，靠 DOM 順序排不出來。

          時段色片與發光層都是 .room 的虛擬元素（::before / ::after），
          所以這裡看不到它們。那是刻意的：它們沒有任何內容也不能被點，
          放成真的 div 只會多兩個永遠不會被讀到的節點。
        -->
        <!--
          窗外的天。一個時段一張圖，同時間只有一張不透明，換時段時交叉淡入。
          虛擬元素只有兩個、已經用掉了，所以這四個只能是真的節點。

          **順序固定 day → dawn → dusk → night，不要重排。** 四個同 z-index，
          所以交叉淡入的那 1.2 秒是靠 DOM 順序決定誰壓誰。

          它們沒有座標：圖是整張房間大小、只有玻璃不透明的疊圖，
          CSS 用 inset: 0 就對位了。天空色改 art/room.py 的 SKY_TOD。
        -->
        <div class="room-sky" data-when="day" aria-hidden="true"></div>
        <div class="room-sky" data-when="dawn" aria-hidden="true"></div>
        <div class="room-sky" data-when="dusk" aria-hidden="true"></div>
        <div class="room-sky" data-when="night" aria-hidden="true"></div>
        <!--
          吊燈打出來的光。**跟上面那層發光層是分開的兩張圖**，因為燈點得下去
          可以關掉，而窗不行——合成一張只會有一個不透明度，半夜關個燈
          會把窗外的夜色一起關掉，窗變成一個黑洞。
          開關寫在 .room 的 data-lamp 上（見 script.js 的 lampSwitch()）。
          它跟天空那四層一樣沒有座標，靠 inset: 0 對位。
        -->
        <div class="room-lamp" aria-hidden="true"></div>
        <!--
          桌燈打出來的光。**跟吊燈是兩張圖，因為是兩個開關**——
          兩盞用的是同一組發光色，所以產圖的時候會照物件的格子把對方圈掉，
          不然關掉一盞會把另一盞一起關掉。
          開關寫在 .room 的 data-desklamp 上（見 script.js 的 lampSwitch()）。
        -->
        <div class="room-desklamp" aria-hidden="true"></div>
        <!--
          書桌上那兩塊螢幕發的光。**第四層，也是唯一一個沒有開關的**——
          窗關不掉、兩盞燈各關各的、螢幕永遠亮著。
          分成四層是因為四條曲線不一樣（窗白天最亮、燈剛好相反、
          螢幕夜裡最搶眼），合成一張只會有一個不透明度。
        -->
        <div class="room-screen" aria-hidden="true"></div>
        <div class="room-beam" aria-hidden="true"></div>
        <div class="bowl" id="bowl" aria-hidden="true"></div>
        <!--
          .cat 只管位置（JS 每幀寫 transform），外觀與反應動畫都在 .cat-sprite。

          它是 <button> 不是 div：摸貓現在是這一頁三個動作之一（待辦第 5 項），
          按鈕列已經刪掉了。div 加 onclick 沒有鍵盤焦點、按 Enter 沒反應、
          螢幕閱讀器也讀不到，等於只有滑鼠使用者摸得到貓。

          碗和逗貓棒的熱區是 script.js 從 room-data.js 生出來的（它們畫在
          背景圖裡，不是元素）；貓不行，牠每幀都在動，只能是牠自己。
        -->
        <button class="cat" id="cat" type="button" data-anim="sit" aria-label="摸摸 Disi">
          <span class="cat-sprite" id="cat-sprite" aria-hidden="true"></span>
        </button>
      </div>
    </div>

    <div class="container room-column">
      <p class="meta" id="meta"></p>
    </div>

    <!--
      漢堡選單的內容面板（待辦第 16 項，2026-09-08 改成側邊抽屜）。
      一開始跟下面的 .gift-panel 共用同一套「fixed 蓋住整頁、木牌、
      Cubic 11、焦點管理、Esc、點外面關閉」的做法，明陽看過桌機版之後
      要的是側邊滑出的抽屜，不是置中的對話框，所以現在開關機制跟紙箱
      不一樣了：這裡用 .is-open 這個 class，不是 hidden 屬性——原因是
      滑出去的動畫要有時間播完，屬性一拿掉就是立刻消失，見 style.css
      那段的說明。焦點管理、Esc、點遮罩關閉這些行為都還在，只是不再
      靠 hidden 屬性驅動。

      內容怎麼換沒有變：預設顯示選單列表，點列表裡的項目換成該項目的
      內容，用「返回選單」換回去。以後第 21/22 項的面板都接在這裡，
      不要再複製一份殼。

      .panel-view 用 hidden 切換，不是 JS 組字串塞進去——內容都是固定的，
      犯不著動態產生。哪天要塞會變的內容（禮物圖鑑、留言板），
      就在那個 view 自己的 div 裡讓 script.js 去填，殼本身不用再動。

      #panel-title 有 tabindex="-1"：切換到有內容的頁面時 script.js 會把
      焦點丟到它身上，讓螢幕閱讀器唸出新的標題，但它不該出現在一般的
      Tab 順序裡，所以不能用真的 tabindex="0"。
    -->
    <div class="panel-overlay" id="menu-panel">
      <div class="panel-sheet" id="panel-sheet" role="dialog" aria-modal="true" aria-labelledby="panel-title">
        <h2 class="panel-title" id="panel-title" tabindex="-1">選單</h2>
        <div class="panel-body" id="panel-body">
          <div class="panel-view" id="menu-list" data-title="選單">
            <ul class="menu-list">
              <li><button type="button" class="menu-item" data-open="game-intro">遊戲介紹</button></li>
              <!--
                待辦第 20 項：先做殼、不接功能。用 disabled 不是靜默的假
                按鈕——第 16 項自己寫過「按下去沒反應的東西比沒有還糟」，
                disabled 至少誠實地說「現在點不了」。
              -->
              <li><button type="button" class="menu-item is-disabled" disabled>音樂控制（敬請期待）</button></li>
              <li><button type="button" class="menu-item" data-open="changelog">更新日誌</button></li>
              <!--
                減少動態從頁尾搬過來的（原本是 #motion-toggle）。
                預設 hidden，顯示邏輯跟以前一樣由 script.js 的 applyMotion() 控制。
              -->
              <li><button type="button" class="menu-item" id="motion-menu-item" hidden aria-pressed="false">減少動態</button></li>
            </ul>
            <hr class="menu-sep" aria-hidden="true">
            <a class="menu-home" href="../../">回首頁</a>
          </div>
          <div class="panel-view" id="game-intro" data-title="遊戲介紹" data-paper="true" hidden>
            <p>Disi 住在明陽淡水的房間裡。牠自己過生活——吃飯、睡覺、偶爾出門走走，
            你進來的時候剛好看到牠在做什麼，僅此而已。</p>
            <p>沒有分數，也沒有任務。摸摸牠、看看牠在忙什麼，就是這個房間全部
            的內容了。</p>
          </div>
          <!--
            待辦第 23 項。清單是 world.js 的 World.UPDATES 算出來的（新到舊），
            不是寫死在這裡——原因跟 .gift-panel 一樣：內容會變的東西讓
            script.js 去填，殼不用跟著動。給開發者看的完整版在 CHANGELOG.md，
            這裡是給訪客看的白話版，不逐字搬。
          -->
          <div class="panel-view" id="changelog" data-title="更新日誌" data-paper="true" hidden>
            <ul class="updates" id="updates"></ul>
          </div>
        </div>
        <div class="panel-actions">
          <button type="button" class="panel-back" id="panel-back" hidden>‹ 返回選單</button>
          <button type="button" class="panel-close" id="panel-close">關閉</button>
        </div>
      </div>
    </div>

    <!--
      貓叼回來的東西，收在房間裡那個紙箱裡（待辦第 17 項）。
      沒有分數也沒有進度條，這張清單就是唯一看得見的累積——
      **空的時候也不會變成「你還沒拿到任何東西」**，理由在 style.css 的 .gift-empty。

      預設 hidden。它是 fixed 不是貼在房間裡，因為房間會左右捲，
      理由寫在 style.css 的「禮物箱」那一段。

      role="dialog" + aria-modal 掛在木牌上不是掛在整層上：
      aria-modal 的意思是「這塊以外的東西讀螢幕都跳過」，
      掛在半透明那層上會連它自己的背景一起算進去。
    -->
    <div class="gift-panel" id="gift-panel" hidden>
      <div class="gift-sheet" role="dialog" aria-modal="true" aria-labelledby="gift-title">
        <h2 class="gift-title" id="gift-title">箱子裡</h2>
        <ul class="gifts" id="gifts"></ul>
        <!--
          空的時候顯示的那一行。**它是 <ul> 的兄弟不是裡面的 <li>**：
          清單裡放一個「還沒有東西」，螢幕閱讀器會唸成「清單，一個項目」，
          而那正好是不對的——箱子裡有零個東西，不是一個。
        -->
        <p class="gift-empty" id="gift-empty" hidden></p>
        <button class="gift-close" id="gift-close" type="button">關起來</button>
      </div>
    </div>
  </main>

  <footer class="container">
    <p class="footer-row">
      <a href="../../">← 回首頁</a>
      <!--
        預設 hidden，由 script.js 決定要不要顯示：只有系統開了減少動畫、
        或目前正處於減少動態時才會出現。先藏著是為了不要在 JS 跑到之前閃一下。
      -->
      <button class="motion-toggle" id="motion-toggle" type="button" aria-pressed="false" hidden>減少動態</button>
    </p>
  </footer>

  <!--
    JS 也有自己的 ?v=，跟圖那一套是**兩回事**，改了程式要在這裡加一。
    2026-09-01 做眨眼的時候就漏掉過：圖換成 6 欄了、sprites.js 也換了，
    只有 script.js 是快取裡的舊版，於是新圖配舊的取格算式——貓照樣在動，
    沒有任何錯誤訊息，就是不會眨眼。查了半天才發現載進來的根本不是我改的那支。

    改動橫跨兩支的時候兩支都要加。眨眼就是這樣：欄數在 sprites.js、
    往右跳幾欄在 script.js，只到一半的話會拿舊的欄數去除新的圖。
  -->
  <script src="world.js?v=7"></script>
  <script src="cat.js?v=1"></script>
  <script src="save.js?v=3"></script>
  <script src="sprites.js?v=6"></script>
  <!--
    room-data.js 是 art/pixel.py 從磚號表產的，不要手改。
    一定要排在 script.js **前面**：那支開頭就會讀 window.RoomData 算
    地板範圍與碗的座標，讀不到會退回上一版房間的數字，貓就走錯地方。

    **改過房間就一定要把 ?v= 加一**，跟 sprite sheet 那條同一個道理，
    而且這裡更陰險：圖有自己的 ?v=，快取的舊幾何配得上新圖，
    畫面看起來是對的，只有座標默默錯掉。`python pixel.py` 會在這支
    真的變了的時候印一行提醒（見 write_room_data()）。
  -->
  <script src="room-data.js?v=11"></script>
  <script src="script.js?v=20"></script>
</body>
</html>
