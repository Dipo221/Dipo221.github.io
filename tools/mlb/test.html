<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>script.js 測試</title>
  <!--
    沒有 build step 也沒有 node，所以測試就是一個網頁：打開就跑，紅的就是壞了。

    測資的形狀直接照抄 data.json 真實的欄位，但日期一律用「離今天幾天」算出來——
    寫死成 2026-09-06 的話，真實日期一過那天，凡是走 daysUntil() 的斷言就會
    無聲地翻成「已可回歸」。第一版吃過這個虧，不要再寫死。

    測試頁刻意不載 theme.js：底下的 summary 顏色是配深色底寫死的，
    跟著切成淺色反而讀不出紅綠。這頁固定深色就好。
  -->
  <link rel="stylesheet" href="../../style.css?v=8" />
  <style>
    body { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; }
    .summary { padding: 12px 16px; border-radius: 8px; font-weight: 700; margin: 16px 0; }
    .summary.pass { background: rgba(110, 231, 168, 0.15); color: #6ee7a8; }
    .summary.fail { background: rgba(248, 113, 113, 0.15); color: #f87171; }
    .group { margin-top: 22px; font-weight: 700; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
    .case { padding: 3px 0 3px 44px; position: relative; font-size: 0.88rem; line-height: 1.5; }
    .case::before { position: absolute; left: 0; top: 4px; font-size: 0.62rem; }
    .case.ok::before { content: "PASS"; color: #6ee7a8; }
    .case.no::before { content: "FAIL"; color: #f87171; }
    .case.no { background: rgba(248, 113, 113, 0.1); }
    .detail { color: #f87171; padding-left: 44px; font-size: 0.82rem; }
  </style>
</head>
<body>
  <header class="hero">
    <div class="container"><h1>script.js 測試</h1></div>
  </header>
  <main class="container" id="out"></main>

  <!--
    script.js 在載入當下就會抓這些元素、綁事件，少一個就整包掛掉，
    所以這裡放一份同 id 的替身讓它跑起來，再餵測資進去驗畫出來的結果。
    藏起來是因為這頁要看的是上面的 PASS/FAIL，不是渲染結果本身。

    這個替身不能用 hidden——display:none 的東西沒辦法接焦點，
    抽屜與我的球員那幾條「焦點有沒有送對地方」的測試會全部量到 body。
    改成挪到畫面外，一樣看不到，但還在算版面、還能 focus。
  -->
  <div id="stage" style="position:absolute; left:-9999px; top:0; width:600px;">
    <p id="summary"></p>
    <p id="stamp"></p>
    <button id="menu-btn" aria-expanded="false"><span id="menu-label"></span></button>
    <div id="nav-scrim" hidden></div>
    <nav id="nav-drawer" hidden>
      <button id="drawer-close"></button>
      <div id="nav-items"></div>
    </nav>
    <select id="view-select"></select>
    <select id="team-select"></select>
    <div id="board"></div>
  </div>

  <footer class="container"><p><a href="./">← 回工具</a></p></footer>

  <script src="script.js?v=6"></script>
  <script>
    const out = document.getElementById("out");
    let passed = 0;
    let failed = 0;

    function group(title) {
      const el = document.createElement("div");
      el.className = "group";
      el.textContent = title;
      out.appendChild(el);
    }

    /*
     * DOM 節點要用 === 比，不能走 JSON.stringify。
     * HTMLElement 沒有自己的可列舉屬性，stringify 出來一律是 "{}"——
     * 拿它比兩個節點的話「焦點回到漢堡鈕」這種斷言不管焦點在哪裡都會綠，
     * 等於白測。第一版就是這樣，這裡補回真正的比對。
     */
    function describe(v) {
      if (v instanceof Element) {
        return (
          "<" + v.tagName.toLowerCase() +
          (v.id ? "#" + v.id : "") +
          (v.className ? "." + String(v.className).trim().split(/\s+/).join(".") : "") +
          ">"
        );
      }
      if (v instanceof Node) return "[" + v.nodeName + "]";
      return JSON.stringify(v);
    }

    function check(label, actual, expected) {
      const isNode = actual instanceof Node || expected instanceof Node;
      const same = isNode
        ? actual === expected
        : JSON.stringify(actual) === JSON.stringify(expected);
      same ? passed++ : failed++;

      const el = document.createElement("div");
      el.className = "case " + (same ? "ok" : "no");
      el.textContent = label;
      out.appendChild(el);

      if (!same) {
        const d = document.createElement("div");
        d.className = "detail";
        d.textContent = `預期 ${describe(expected)}，實際 ${describe(actual)}`;
        out.appendChild(d);
      }
    }

    /* ---------------------------------------------------------- */

    group("normalizeName：關注名單要對得起來");
    {
      const n = MLB.normalizeName;
      // 這函式存在的唯一理由：watchlist 用純 ASCII 打，資料源是帶重音的
      check("重音去掉", n("Ronald Acuña Jr."), "ronald acuna jr");
      check("沒重音的寫法算出一樣的結果", n("Ronald Acuna Jr."), n("Ronald Acuña Jr."));
      check("大小寫不影響", n("AARON JUDGE"), "aaron judge");
      check("句點逗號去掉", n("Luis L. Ortiz"), "luis l ortiz");
      check("彎引號跟直引號一樣", n("Logan O’Hoppe"), n("Logan O'Hoppe"));
      check("多餘空白收成一個", n("  Cal   Raleigh  "), "cal raleigh");
      check("兩種重音寫法都要收斂", n("José Ramírez"), "jose ramirez");
      check("空值不爆掉", n(null), "");
      check("不同人不能被歸成同一個", n("Will Smith") === n("Will Smith Jr."), false);
    }

    group("shortDate：不要因為時區跳掉一天");
    {
      const d = MLB.shortDate;
      // new Date('2026-08-31') 會被當 UTC 午夜，在台北顯示會變成 8/30
      check("2026-08-31 → 8/31", d("2026-08-31"), "8/31");
      check("開頭的 0 去掉", d("2026-09-06"), "9/6");
      check("元旦不會變成前一年 12/31", d("2026-01-01"), "1/1");
      check("空值回空字串", d(""), "");
      check("看不懂的格式原樣吐回來", d("九月"), "九月");
    }

    group("returnLabel：只講「最快」，不講「預計」");
    {
      const r = MLB.returnLabel;
      check("還有 5 天", r("2026-09-06", 5), "最快 9/6 可回歸（還有 5 天）");
      check("剩 1 天講明天", r("2026-09-02", 1), "最快明天可回歸");
      check("今天就可以", r("2026-09-01", 0), "已可回歸");
      check("早就過了也是已可回歸", r("2026-08-20", -12), "已可回歸");
      check("不知道還有幾天就只講日期", r("2026-09-06", null), "最快 9/6 可回歸");
      check("算不出日期就整句不講", r(null, 3), "");
      // 標籤絕對不能寫成「預計」——這是規則算出來的最早資格日，不是傷勢預估
      check("文案不含「預計」", /預計/.test(r("2026-09-06", 5)), false);
    }

    /*
     * 離今天幾天 -> 'YYYY-MM-DD'。
     * 用 Date 的 setDate 讓它自己處理跨月跨年，比自己算安全。
     */
    function d(offset) {
      const t = new Date();
      t.setDate(t.getDate() + offset);
      const mm = String(t.getMonth() + 1).padStart(2, "0");
      const dd = String(t.getDate()).padStart(2, "0");
      return t.getFullYear() + "-" + mm + "-" + dd;
    }

    group("daysUntil：即將歸隊的排序靠它");
    {
      const u = MLB.daysUntil;
      // 這個數字刻意在前端現算，不用 data.json 裡的 daysUntil——
      // JSON 可能是幾小時前產的，跨過半夜就整整差一天
      check("今天是 0", u(d(0)), 0);
      check("明天是 1", u(d(1)), 1);
      check("昨天是 -1", u(d(-1)), -1);
      check("兩週後是 14", u(d(14)), 14);
      check("跨月也對", u(d(45)), 45);
      check("空值回 null", u(null), null);
      check("格式不對回 null", u("九月六日"), null);
    }

    /* ---------------------------------------------------------- */

    const TEAMS = [
      { id: 142, name: "Minnesota Twins", abbr: "MIN", league: "American League", division: "AL Central" },
      { id: 143, name: "Philadelphia Phillies", abbr: "PHI", league: "National League", division: "NL East" },
      { id: 136, name: "Seattle Mariners", abbr: "SEA", league: "American League", division: "AL West" },
    ];

    /*
     * players.json 的形狀：一列一個陣列 [id, name, pos, teamId]，
     * 欄位名寫在檔案的 fields 裡。用陣列存純粹是為了體積（38KB vs 66KB）。
     */
    const INDEX = {
      generatedAt: d(0) + "T15:15:07Z",
      fields: ["id", "name", "pos", "teamId"],
      players: [
        [621439, "Byron Buxton", "CF", 142],
        [700001, "Comeback Kid", "1B", 143],
        [700002, "Ronald Acuña Jr.", "RF", 143],
        [700003, "No Start Date", "P", 136],
        [700004, "Fresh Debut", "SS", 142],
        [700005, "Shuttle Guy", "RP", 143],
        [700006, "New Dad", "C", 136],
        // 兩用球員：篩打者跟篩投手都要看得到他
        [700007, "Shohei Ohtani", "TWP", 143],
        [700008, "Soon Back", "LF", 142],
        [700009, "Contract Guy", "RP", 136],
        [665487, "Fernando Tatis Jr.", "RF", 143],
        [691406, "Junior Caminero", "3B", 136],
      ],
    };

    const DATA = {
      generatedAt: d(0) + "T15:15:07Z",
      season: 2026,
      windows: { moves: 7, hardHit: 14, callups: 14 },
      teams: TEAMS,
      ilMoves: [
        {
          playerId: 621439, name: "Byron Buxton", teamId: 142, date: d(-3),
          action: "placed", listKind: "injured", days: 10,
          injury: "Right hip impingement.", earliestReturn: d(5),
          description: "placed CF Byron Buxton on the 10-day injured list.",
        },
        {
          playerId: 700001, name: "Comeback Kid", teamId: 143, date: d(-2),
          action: "activated", listKind: "injured", days: 10,
          injury: "", earliestReturn: null,
          description: "activated Comeback Kid from the 10-day injured list.",
        },
        {
          playerId: 700006, name: "New Dad", teamId: 136, date: d(-1),
          action: "placed", listKind: "paternity", days: null,
          injury: null, earliestReturn: null,
          description: "placed C New Dad on the paternity list.",
        },
        {
          playerId: 700008, name: "Soon Back", teamId: 142, date: d(-5),
          action: "placed", listKind: "injured", days: 10,
          injury: "Left oblique strain.", earliestReturn: d(2),
          description: "placed LF Soon Back on the 10-day injured list.",
        },
      ],
      ilBoard: [
        {
          playerId: 621439, name: "Byron Buxton", teamId: 142, pos: "CF",
          status: "D10", statusDesc: "Injured 10-Day", injury: "Right hip impingement.",
          startDate: d(-5), earliestReturn: d(5), daysUntil: 5,
        },
        {
          playerId: 700002, name: "Ronald Acuña Jr.", teamId: 143, pos: "RF",
          status: "D60", statusDesc: "Injured 60-Day", injury: "Left wrist tracture",
          startDate: d(-90), earliestReturn: d(-30), daysUntil: -30,
        },
        {
          playerId: 700003, name: "No Start Date", teamId: 136, pos: "P",
          status: "D15", statusDesc: "Injured 15-Day", injury: "",
          startDate: null, earliestReturn: null, daysUntil: null,
        },
      ],
      // 三個時間窗都從同一份快取算，所以榜單會整份換人，不是只換數字
      hardHits: {
        d14: [
          { playerId: 665487, name: "Fernando Tatis Jr.", teamId: 143, hardHits: 28, barrels: 9, battedBalls: 44, hardHitRate: 0.636, barrelRate: 0.2, maxEV: 115.1, avgEV: 92.1, games: 12 },
          { playerId: 691406, name: "Junior Caminero", teamId: 136, hardHits: 23, barrels: 7, battedBalls: 43, hardHitRate: 0.535, barrelRate: 0.163, maxEV: 116.9, avgEV: 95.9, games: 13 },
        ],
        d7: [
          { playerId: 691406, name: "Junior Caminero", teamId: 136, hardHits: 12, barrels: 4, battedBalls: 21, hardHitRate: 0.571, barrelRate: 0.190, maxEV: 116.9, avgEV: 95.2, games: 6 },
        ],
        d3: [
          { playerId: 700007, name: "Shohei Ohtani", teamId: 143, hardHits: 5, barrels: 2, battedBalls: 9, hardHitRate: 0.556, barrelRate: 0.222, maxEV: 114.0, avgEV: 94.0, games: 3 },
        ],
      },
      barrels: {
        d14: [
          { playerId: 665487, name: "Fernando Tatis Jr.", teamId: 143, hardHits: 28, barrels: 9, battedBalls: 44, hardHitRate: 0.636, barrelRate: 0.2, maxEV: 115.1, avgEV: 92.1, games: 12 },
        ],
        d7: [
          { playerId: 691406, name: "Junior Caminero", teamId: 136, hardHits: 12, barrels: 4, battedBalls: 21, hardHitRate: 0.571, barrelRate: 0.190, maxEV: 116.9, avgEV: 95.2, games: 6 },
        ],
        d3: [],
      },
      callups: [
        { playerId: 700004, name: "Fresh Debut", teamId: 142, pos: "SS", date: d(-4), type: "SE", typeDesc: "Selected", isDebut: true, age: 21 },
        { playerId: 700005, name: "Shuttle Guy", teamId: 143, pos: "RP", date: d(-2), type: "CU", typeDesc: "Recalled", isDebut: false, age: 27 },
        { playerId: 700009, name: "Contract Guy", teamId: 136, pos: "RP", date: d(-1), type: "SE", typeDesc: "Selected", isDebut: false, age: 29 },
      ],
      streaks: {
        wins: [{ teamId: 143, code: "W5", n: 5, wins: 78, losses: 60, type: "wins" }],
        losses: [{ teamId: 136, code: "L5", n: 5, wins: 64, losses: 74, type: "losses" }],
      },
      news: [
        { title: "Buxton hits the IL with hip impingement", link: "https://example.com/a", source: "MLB Trade Rumors", date: d(0) + "T10:00:00Z", cat: "injury" },
        { title: "Pirates Select Christian Bethancourt", link: "https://example.com/b", source: "MLB Trade Rumors", date: d(0) + "T09:00:00Z", cat: "move" },
        { title: "Week 22 Waiver Wire Rankings", link: "https://example.com/c", source: "Rotoworld", date: d(-1) + "T08:00:00Z", cat: "analysis" },
        { title: "Manager talks lineup construction", link: "https://example.com/d", source: "MLB.com", date: d(-1) + "T07:00:00Z", cat: "other" },
      ],
      hotStats: [],
      source: "MLB Stats API",
    };

    // 故意用沒有重音的寫法，驗 normalizeName 真的接在關注名單的比對路徑上
    const WATCH = { players: [{ name: "Byron Buxton" }, { name: "Ronald Acuna Jr.", note: "OF1" }] };

    const board = document.getElementById("board");
    const teamSelect = document.getElementById("team-select");
    const viewSelect = document.getElementById("view-select");
    const tabs = document.getElementById("nav-items");
    const menuBtn = document.getElementById("menu-btn");
    const drawer = document.getElementById("nav-drawer");
    const scrim = document.getElementById("nav-scrim");

    /*
     * 測試會反覆餵同一份測資，但 normalizeData() 會就地改寫 payload
     * （舊形狀的 hardHits 陣列會被換成物件、每列補上 hardHitRate）。
     * 每次都給一份新的複本，不然第二次測到的已經是被改過的東西。
     */
    const clone = (o) => JSON.parse(JSON.stringify(o));

    const STORE_KEYS = ["mlb:tab", "mlb:views", "mlb:watch", "mlb:roster"];

    function seed(store) {
      STORE_KEYS.forEach(function (k) {
        try { localStorage.removeItem(k); } catch (err) { /* 無痕模式 */ }
      });
      Object.keys(store || {}).forEach(function (k) {
        try { localStorage.setItem(k, JSON.stringify(store[k])); } catch (err) { /* 同上 */ }
      });
    }

    // 清乾淨 localStorage、餵一份全新的測資，等於「重開一次頁面」
    function load(store, payload, watch, index) {
      seed(store);
      MLB.applyData(
        clone(payload || DATA),
        watch === undefined ? WATCH : watch,
        index === undefined ? INDEX : index
      );
    }

    function readStore(key) {
      try { return JSON.parse(localStorage.getItem(key)); } catch (err) { return null; }
    }

    function showTab(label) {
      const btn = Array.prototype.filter.call(tabs.querySelectorAll(".nav-item"), (b) =>
        b.textContent.indexOf(label) === 0
      )[0];
      if (!btn) throw new Error("找不到區塊：" + label);
      btn.click();
    }

    function navCount(label) {
      const btn = Array.prototype.filter.call(tabs.querySelectorAll(".nav-item"), (b) =>
        b.textContent.indexOf(label) === 0
      )[0];
      return Number(btn.querySelector(".nav-count").textContent);
    }

    function esc() {
      document.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape" }));
    }

    function pickTeam(id) {
      teamSelect.value = String(id);
      teamSelect.dispatchEvent(new Event("change"));
    }

    function pickView(id) {
      viewSelect.value = String(id);
      viewSelect.dispatchEvent(new Event("change"));
    }

    const texts = (sel, root) =>
      Array.prototype.map.call((root || board).querySelectorAll(sel), (n) => n.textContent);

    const optionValues = () => Array.prototype.map.call(viewSelect.options, (o) => o.value);
    const optionLabels = () => Array.prototype.map.call(viewSelect.options, (o) => o.textContent);

    /*
     * 卡片上的名字。.card-name 裡面前面還疊了一個守備位置的 span，
     * 直接讀 textContent 會拿到 "CFByron Buxton"，只取最後那個文字節點。
     */
    const names = () =>
      Array.prototype.map.call(board.querySelectorAll(".card-name"), (n) =>
        n.lastChild ? n.lastChild.textContent : ""
      );

    const slotSel = (kind, i) => '[data-slot="' + kind + "-" + i + '"]';
    const slotCount = (kind) => board.querySelectorAll('[data-slot^="' + kind + '-"]').length;
    const slotLabels = (kind) =>
      Array.prototype.map.call(
        board.querySelectorAll('[data-slot^="' + kind + '-"] .slot-label'),
        (n) => n.textContent
      );

    function typeIn(input, text) {
      input.value = text;
      input.dispatchEvent(new Event("input"));
    }

    function fillSlot(kind, index, query) {
      board.querySelector(slotSel(kind, index) + " .slot-empty").click();
      typeIn(board.querySelector(".picker-input"), query);
      const hit = board.querySelector(".picker-hit");
      if (!hit) throw new Error("搜尋不到：" + query);
      hit.click();
    }

    /*
     * 測試會一直切分頁、按星號、填名單，這些全部寫在跟正式頁共用的 localStorage 上。
     * 跑完把使用者原本的四個 key 都還回去——不是只有 mlb:tab，
     * 不然開一次測試頁就會把他的關注名單跟我的球員洗掉。
     */
    const savedStore = {};
    STORE_KEYS.forEach(function (k) {
      try { savedStore[k] = localStorage.getItem(k); } catch (err) { savedStore[k] = null; }
    });

    let restored = false;
    function restoreStore() {
      if (restored) return;
      restored = true;
      STORE_KEYS.forEach(function (k) {
        try {
          if (savedStore[k] === null) localStorage.removeItem(k);
          else localStorage.setItem(k, savedStore[k]);
        } catch (err) {
          /* 無痕模式本來就存不進去，沒什麼好還的 */
        }
      });
    }

    function report() {
      const summary = document.createElement("div");
      summary.className = "summary " + (failed ? "fail" : "pass");
      summary.textContent = failed
        ? `${failed} 個失敗 / 共 ${passed + failed} 個`
        : `全部通過（${passed} 個）`;
      out.insertBefore(summary, out.firstChild);
      document.title = (failed ? `${failed} FAIL` : "PASS") + " — script.js 測試";
    }

    /*
     * 測到一半丟例外的話，後面的還原跟結算都不會跑——畫面上只會停在半路、
     * 沒有紅字也沒有總結，而使用者的名單會被留在測試資料上。
     * 掛在 error 上補做這兩件事：這正是最需要它們的時候。
     */
    window.addEventListener("error", function (e) {
      restoreStore();
      check("測試跑到一半丟例外：" + (e.message || e.error), false, true);
      report();
    });

    load({});

    /* ---------------------------------------------------------- */

    group("TABS 與 SECTIONS 是同一份清單");
    {
      const tabIds = MLB.TABS.map((t) => t.id).sort();
      const secIds = Object.keys(MLB.SECTIONS).sort();
      // 分頁定義跟畫法定義分成兩個物件，漏掉一邊就會在切過去的當下才爆炸。
      // 這條測試就是為了讓它在這裡先紅，而不是在使用者面前。
      check("兩邊的 id 完全一致", tabIds, secIds);
      check("id 沒有重複", tabIds.length, new Set(tabIds).size);
      check("每一區都有 render", Object.keys(MLB.SECTIONS).filter((k) => typeof MLB.SECTIONS[k].render !== "function"), []);
      check("每一區都有 count", Object.keys(MLB.SECTIONS).filter((k) => typeof MLB.SECTIONS[k].count !== "function"), []);
      check("九個區塊", MLB.TABS.length, 9);
      check("群組是照順序連在一起的", MLB.TABS.map((t) => t.group), [
        "我的", "我的", "傷兵", "傷兵", "打擊", "打擊", "其他", "其他", "其他",
      ]);
    }

    group("選單");
