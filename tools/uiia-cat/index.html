<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>uiia cat</title>
  <!--
    theme.js 要排在樣式表前面，而且不能加 defer——
    data-theme 必須在第一次 paint 之前設好，晚一步就會閃一下深色。
    這頁沒有切換鈕，只是跟著首頁選好的主題走。
    ?v= 是給瀏覽器快取用的版本號，改到這些檔案時記得一起加一。
  -->
  <link rel="preload" as="font" type="font/woff2" href="../../fonts/space-grotesk-latin.woff2" crossorigin />
  <script src="../../theme.js?v=1"></script>
  <link rel="stylesheet" href="../../style.css?v=6" />
  <link rel="stylesheet" href="style.css?v=4" />
  <!-- 先抓好旋轉用的 GIF，第一次點擊才不會卡一下 -->
  <link rel="preload" as="image" href="cat-spin.gif" />
</head>
<body>
  <header class="hero">
    <div class="container">
      <h1>uiia cat</h1>
      <p class="tagline">uiia uuiiia uiiia</p>
    </div>
  </header>

  <main class="container">
    <div class="stage">
      <button id="cat" class="cat-button" aria-label="點擊讓貓咪旋轉並發出聲音">
        <img
          id="cat-img"
          class="cat-img"
          src="cat-still.png"
          alt="一隻虎斑貓"
          width="200"
          height="200"
          draggable="false"
        />
      </button>

      <div class="counter">
        <span id="count" class="count-value">—</span>
        <span class="count-label">次 uiia</span>
      </div>

      <p class="counter-note">全世界一起累積的次數</p>
    </div>
  </main>

  <footer class="container">
    <p><a href="../../">← 回首頁</a></p>
  </footer>

  <script src="script.js?v=3"></script>
</body>
</html>
