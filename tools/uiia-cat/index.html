<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>uiia cat</title>
  <!-- ?v= 是給瀏覽器快取用的版本號，改到這些檔案時記得一起加一 -->
  <link rel="stylesheet" href="../../style.css?v=2" />
  <link rel="stylesheet" href="style.css?v=2" />
  <!-- 先抓好旋轉用的 GIF，第一次點擊才不會卡一下 -->
  <link rel="preload" as="image" href="cat-spin.gif" />
</head>
<body>
  <header class="hero">
    <div class="container">
      <h1>uiia cat</h1>
      <p class="tagline">點一下貓咪，牠就會 uiia 一聲轉起來</p>
    </div>
  </header>

  <main class="container">
    <div class="stage">
      <button id="cat" class="cat-button" aria-label="點擊讓貓咪旋轉並發出聲音">
        <img
          id="cat-img"
          class="cat-img"
          src="cat-still.png"
          alt="一隻虎斑貓"
          width="200"
          height="200"
          draggable="false"
        />
      </button>

      <div class="counter">
        <span id="count" class="count-value">0</span>
        <span class="count-label">次 uiia</span>
      </div>

      <button id="reset" class="reset-button" type="button">歸零</button>
    </div>
  </main>

  <footer class="container">
    <p><a href="../../">← 回首頁</a></p>
  </footer>

  <script src="script.js?v=2"></script>
</body>
</html>
